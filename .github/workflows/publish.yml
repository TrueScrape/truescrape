name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: hygiene
        env:
          DENYLIST: ${{ secrets.HYGIENE_DENYLIST }}
        run: |
          printf '%s\n' "$DENYLIST" > "$RUNNER_TEMP/denylist.txt"
          TRUESCRAPE_HYGIENE_DENYLIST="$RUNNER_TEMP/denylist.txt" pnpm hygiene
      - name: publish unless this version is already on npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "truescrape@${version}" version >/dev/null 2>&1; then
            echo "truescrape@${version} is already published; nothing to do."
            exit 0
          fi
          npm publish --provenance --access public
